# ════════════════════════════════════════════════════════════════
# Untrace Desktop — Release Build
# Builds amneziawg-go tunnel engine from source, bundles into
# Tauri installers for macOS (arm64 + x64) and Windows (x64).
# Triggered on v* tags or manual dispatch.
# ════════════════════════════════════════════════════════════════
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Pinned upstream commit for reproducible builds
env:
  AMNEZIAWG_REPO: https://github.com/amnezia-vpn/amneziawg-go.git
  AMNEZIAWG_COMMIT: b5928efb6ca19f0153958460c3d141f04abc5c2e
  WINTUN_VERSION: "0.14.1"
  GO_VERSION: "1.25.1"

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '') || `v${require('./package.json').version}`;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Untrace ${tag}`,
              body: `## Untrace ${tag}\n\nDownload the installer for your platform below.\n\n### Installation Notes\n- **macOS**: Right-click the app → Open (bypasses Gatekeeper for unsigned apps)\n- **Windows**: If SmartScreen appears → More info → Run anyway\n\n### What's included\n- Accountless VPN — no sign-up needed\n- Stealth protocol with 256-bit encryption\n- Amsterdam exit node (AMS-01)\n- Real tunnel engine with hardware-accelerated crypto\n`,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            go_os: darwin
            go_arch: arm64
            tunnel_name: tunnel-engine
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            go_os: darwin
            go_arch: amd64
            tunnel_name: tunnel-engine
          - platform: windows-latest
            args: ''
            go_os: windows
            go_arch: amd64
            tunnel_name: tunnel-engine.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      # ── Build amneziawg-go tunnel engine from source ──────────
      - name: Clone amneziawg-go
        run: |
          git clone ${{ env.AMNEZIAWG_REPO }} /tmp/amneziawg-go
          cd /tmp/amneziawg-go
          git checkout ${{ env.AMNEZIAWG_COMMIT }}

      - name: Build tunnel engine
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.go_os }}
          GOARCH: ${{ matrix.go_arch }}
        run: |
          cd /tmp/amneziawg-go
          go build -o ${{ github.workspace }}/src-tauri/resources/${{ matrix.tunnel_name }} \
            -ldflags="-s -w" .
          echo "Built tunnel engine:"
          ls -lh ${{ github.workspace }}/src-tauri/resources/${{ matrix.tunnel_name }}
          file ${{ github.workspace }}/src-tauri/resources/${{ matrix.tunnel_name }}

      # ── Windows: download wintun.dll ─────────────────────────
      - name: Download wintun.dll (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cd /tmp
          curl -fsSL "https://www.wintun.net/builds/wintun-${{ env.WINTUN_VERSION }}.zip" -o wintun.zip
          unzip -o wintun.zip "wintun/bin/amd64/wintun.dll"
          cp wintun/bin/amd64/wintun.dll ${{ github.workspace }}/src-tauri/resources/wintun.dll
          echo "wintun.dll bundled:"
          ls -lh ${{ github.workspace }}/src-tauri/resources/wintun.dll

      # ── Make tunnel engine executable (macOS/Linux) ──────────
      - name: Set executable permissions
        if: matrix.platform != 'windows-latest'
        run: chmod +x src-tauri/resources/tunnel-engine

      # ── Verify resources ─────────────────────────────────────
      - name: Verify bundled resources
        shell: bash
        run: |
          echo "=== Resources directory ==="
          ls -lh src-tauri/resources/
          echo ""
          echo "=== Binary verification ==="
          file src-tauri/resources/${{ matrix.tunnel_name }}
          SIZE=$(stat -f%z src-tauri/resources/${{ matrix.tunnel_name }} 2>/dev/null || stat --printf="%s" src-tauri/resources/${{ matrix.tunnel_name }} 2>/dev/null)
          echo "Tunnel engine size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: Tunnel engine binary is too small ($SIZE bytes). Expected >1MB."
            exit 1
          fi

      # ── Build Tauri app ──────────────────────────────────────
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ""
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.release_id),
              draft: false,
            });
