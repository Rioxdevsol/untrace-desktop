# ════════════════════════════════════════════════════════════════
# Untrace Desktop — CI Build (PR/push validation)
# Builds amneziawg-go from source and produces Tauri installers.
# Artifacts uploaded but NOT published to a release.
# ════════════════════════════════════════════════════════════════
name: Build Desktop

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Pinned upstream commit for reproducible builds
env:
  AMNEZIAWG_REPO: https://github.com/amnezia-vpn/amneziawg-go.git
  AMNEZIAWG_COMMIT: b5928efb6ca19f0153958460c3d141f04abc5c2e
  WINTUN_VERSION: "0.14.1"
  GO_VERSION: "1.25.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
            go_os: darwin
            go_arch: arm64
            tunnel_name: tunnel-engine
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
            go_os: darwin
            go_arch: amd64
            tunnel_name: tunnel-engine
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            go_os: windows
            go_arch: amd64
            tunnel_name: tunnel-engine.exe

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci

      # ── Build amneziawg-go tunnel engine from source ──────────
      - name: Clone amneziawg-go
        shell: bash
        run: |
          git clone ${{ env.AMNEZIAWG_REPO }} "$RUNNER_TEMP/amneziawg-go"
          cd "$RUNNER_TEMP/amneziawg-go"
          git checkout ${{ env.AMNEZIAWG_COMMIT }}

      - name: Build tunnel engine
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.go_os }}
          GOARCH: ${{ matrix.go_arch }}
        run: |
          cd "$RUNNER_TEMP/amneziawg-go"
          go build -o "$GITHUB_WORKSPACE/src-tauri/resources/${{ matrix.tunnel_name }}" \
            -ldflags="-s -w" .
          echo "Built tunnel engine:"
          ls -lh "$GITHUB_WORKSPACE/src-tauri/resources/${{ matrix.tunnel_name }}"
          file "$GITHUB_WORKSPACE/src-tauri/resources/${{ matrix.tunnel_name }}"

      - name: Download wintun.dll (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL "https://www.wintun.net/builds/wintun-${{ env.WINTUN_VERSION }}.zip" -o wintun.zip
          unzip -o wintun.zip "wintun/bin/amd64/wintun.dll"
          cp wintun/bin/amd64/wintun.dll "$GITHUB_WORKSPACE/src-tauri/resources/wintun.dll"
          echo "wintun.dll bundled:"
          ls -lh "$GITHUB_WORKSPACE/src-tauri/resources/wintun.dll"

      - name: Set executable permissions
        if: matrix.os != 'windows-latest'
        run: chmod +x src-tauri/resources/tunnel-engine

      - name: Verify resources
        shell: bash
        run: |
          ls -lh src-tauri/resources/
          file src-tauri/resources/${{ matrix.tunnel_name }}
          SIZE=$(wc -c < src-tauri/resources/${{ matrix.tunnel_name }})
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: Tunnel engine too small ($SIZE bytes)"
            exit 1
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ""
        with:
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: untrace-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
          if-no-files-found: warn
