# ════════════════════════════════════════════════════════════════
# Untrace Desktop — Cross-platform Build (macOS, Windows, Linux)
# Triggered on push to main/master or manual dispatch.
# Produces DMG (macOS), NSIS installer (Windows), AppImage/deb (Linux).
# ════════════════════════════════════════════════════════════════
name: Build Desktop

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare tunnel engine placeholder
        shell: bash
        run: |
          mkdir -p src-tauri/resources
          echo "placeholder" > src-tauri/resources/tunnel-engine
          chmod +x src-tauri/resources/tunnel-engine 2>/dev/null || true

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing for unsigned builds
          TAURI_SIGNING_PRIVATE_KEY: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Untrace v__VERSION__'
          releaseBody: |
            ## Untrace v__VERSION__

            Download the installer for your platform below.

            ### Installation Notes
            - **macOS**: Right-click the app → Open (bypasses Gatekeeper for unsigned apps)
            - **Windows**: If SmartScreen appears → More info → Run anyway
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: untrace-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
          if-no-files-found: warn
